<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enzyme vs. Damaged Sequence Impact Analysis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .panel {
      background: #020617;
      padding: 16px;
      border-radius: 10px;
      max-width: 800px;
      margin: auto;
    }

    textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
    }

    textarea {
      background: #020617;
      color: white;
      border: 1px solid #334155;
      font-family: monospace;
      height: 140px;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .results {
      margin-top: 20px;
    }

    .box {
      background: #020617;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .label {
      font-weight: bold;
      color: #93c5fd;
    }

    .error {
      color: #f87171;
      margin-top: 10px;
      font-weight: bold;
    }

    .loading {
      color: #facc15;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <h1>Enzyme vs. Damaged Sequence Impact Analysis</h1>

  <div class="panel">

    <!-- Reference sequence -->
    <textarea
      id="referenceSequence"
      placeholder="Paste reference (functional) enzyme sequence"
    ></textarea>

    <!-- Damaged sequence -->
    <textarea
      id="damagedSequence"
      placeholder="Paste damaged enzyme sequence"
    ></textarea>

    <button onclick="runAnalysis()">Preview Functionalty</button>

    <div id="status"></div>

    <div class="results" id="results" style="display:none;">
      <div class="box">
        <span class="label">UniProt ID:</span>
        <span id="uniprot"></span>
      </div>

      <div class="box">
        <span class="label">Damage Classification:</span>
        <span id="damage"></span>
      </div>

      <div class="box">
        <span class="label">Functional Impact:</span>
        <span id="impact"></span>
      </div>

      <div class="box">
        <span class="label">Confidence Score:</span>
        <span id="confidence"></span>
      </div>
    </div>
  </div>

  <script>
    async function runAnalysis() {
      const reference = document.getElementById("referenceSequence").value.trim();
      const damaged = document.getElementById("damagedSequence").value.trim();
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      status.innerHTML = "";
      results.style.display = "none";

      if (!reference || !damaged) {
        status.innerHTML =
          "<div class='error'>Please provide both reference and damaged sequences.</div>";
        return;
      }

      status.innerHTML = "<div class='loading'>Analyzing sequences...</div>";

      try {
        const response = await fetch(
          "https://backend123-xbsm.onrender.com/analyze", 
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              reference_sequence: reference,
              damaged_sequence: damaged
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Analysis failed");
        }

        document.getElementById("uniprot").textContent = data.uniprot_id;
        document.getElementById("damage").textContent = data.damage_type;
        document.getElementById("impact").textContent = data.functional_impact;
        document.getElementById("confidence").textContent = data.confidence;

        status.innerHTML = "";
        results.style.display = "block";

      } catch (err) {
        status.innerHTML = `<div class="error">${err.message}</div>`;
        console.error(err);
      }
    }
  </script>
</body>
</html>
