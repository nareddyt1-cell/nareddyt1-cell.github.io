<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enzyme vs. Damaged Sequence Impact Analysis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .panel {
      background: #020617;
      padding: 16px;
      border-radius: 10px;
      max-width: 800px;
      margin: auto;
    }

    textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
      font-size: 15px;
    }

    textarea {
      background: #020617;
      color: white;
      border: 1px solid #334155;
      height: 120px;
      font-family: monospace;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .results {
      margin-top: 20px;
    }

    .box {
      background: #020617;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .label {
      font-weight: bold;
      color: #93c5fd;
    }

    .error {
      color: #f87171;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <h1>Enzyme vs. Damaged Sequence Impact Analysis</h1>

  <div class="panel">

    <label class="label">Functioning (Reference) Sequence</label>
    <textarea id="referenceSeq" placeholder="Paste functioning enzyme sequence"></textarea>

    <label class="label">Damaged Sequence</label>
    <textarea id="damagedSeq" placeholder="Paste damaged enzyme sequence"></textarea>

    <button id="previewBtn">Preview Functional Annotation</button>

    <div id="status"></div>

    <div class="results" id="results" style="display:none;">
      <div class="box">
        <span class="label">Identified Pancreatic Enzyme:</span>
        <span id="enzyme"></span>
      </div>

      <div class="box">
        <span class="label">UniProt ID:</span>
        <span id="uniprot"></span>
      </div>

      <div class="box">
        <span class="label">Damaged Region:</span>
        <span id="damage"></span>
      </div>

      <div class="box">
        <span class="label">Functional Impact:</span>
        <span id="impact"></span>
      </div>

      <div class="box">
        <span class="label">Confidence:</span>
        <span id="confidence"></span>
      </div>
    </div>

  </div>

  <script>
    document.getElementById("previewBtn").addEventListener("click", runAnalysis);

    async function runAnalysis() {
      const reference = document.getElementById("referenceSeq").value.trim();
      const damaged = document.getElementById("damagedSeq").value.trim();
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      if (!reference || !damaged) {
        status.innerHTML = "<div class='error'>Both sequences are required.</div>";
        return;
      }

      status.innerHTML = "Analyzing pancreatic enzyme…";
      results.style.display = "none";

      try {
        const response = await fetch(
          "https://backend123-xbsm.onrender.com/analyze",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              reference_sequence: reference,
              damaged_sequence: damaged
            })
          }
        );

        if (!response.ok) {
          throw new Error("Backend error");
        }

        const data = await response.json();

        document.getElementById("enzyme").textContent = data.enzyme_name;
        document.getElementById("uniprot").textContent = data.uniprot_id;
        document.getElementById("damage").textContent = data.damaged_region;
        document.getElementById("impact").textContent = data.functional_impact;
        document.getElementById("confidence").textContent = data.confidence;

        status.innerHTML = "";
        results.style.display = "block";

      } catch (err) {
        console.error(err);
        status.innerHTML =
          "<div class='error'>Backend request failed.</div>";
      }
    }
  </script>

</body>
</html>
