<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enzyme vs. Damaged Sequence Impact Analysis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .panel {
      background: #020617;
      padding: 16px;
      border-radius: 10px;
      max-width: 700px;
      margin: auto;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    input {
      background: #020617;
      color: white;
      border: 1px solid #334155;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .results {
      margin-top: 20px;
    }

    .box {
      background: #020617;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .label {
      font-weight: bold;
      color: #93c5fd;
    }

    .error {
      color: #f87171;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <h1>Enzyme vs. Damaged Sequence Impact Analysis</h1>

  <div class="panel">
    <input id="sequenceInput" placeholder="Paste amino acid sequence (FASTA or raw)" />

    <button onclick="runAnalysis()">Analyze Sequence</button>

    <div id="status"></div>

    <div class="results" id="results" style="display:none;">
      <div class="box">
        <span class="label">UniProt ID:</span>
        <span id="uniprot"></span>
      </div>

      <div class="box">
        <span class="label">Damage Classification:</span>
        <span id="damage"></span>
      </div>

      <div class="box">
        <span class="label">Functional Impact:</span>
        <span id="impact"></span>
      </div>

      <div class="box">
        <span class="label">Confidence Score:</span>
        <span id="confidence"></span>
      </div>
    </div>
  </div>

  <script>
    async function runAnalysis() {
      const sequence = document.getElementById("sequenceInput").value.trim();
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      if (!sequence) {
        status.innerHTML = "<div class='error'>Please enter a sequence.</div>";
        return;
      }

      status.innerHTML = "Analyzing...";
      results.style.display = "none";

      try {
        const response = await fetch("YOUR_API_URL_HERE", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ sequence })
        });

        if (!response.ok) {
          throw new Error("API request failed");
        }

        const data = await response.json();

        document.getElementById("uniprot").textContent = data.uniprot_id;
        document.getElementById("damage").textContent = data.damage_type;
        document.getElementById("impact").textContent = data.functional_impact;
        document.getElementById("confidence").textContent = data.confidence;

        status.innerHTML = "";
        results.style.display = "block";

      } catch (err) {
        status.innerHTML = "<div class='error'>Failed to analyze sequence.</div>";
        console.error(err);
      }
    }
  </script>
</body>
</html>
