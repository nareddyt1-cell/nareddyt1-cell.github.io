<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pancreatic Enzyme Damage Analysis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #93c5fd;
      margin-bottom: 24px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 10px;
      font-family: monospace;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #020617;
      color: white;
    }

    button {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .enzyme-id {
      text-align: center;
      font-weight: bold;
      color: #facc15;
      margin-top: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .box {
      padding: 14px;
      border-radius: 12px;
      color: #020617;
    }

    .amber { background: #fde68a; }
    .red   { background: #fca5a5; }
    .sky   { background: #bae6fd; }
    .green { background: #bbf7d0; }
    .violet { background: #ddd6fe; }

    .label {
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
    }

    .error {
      color: #f87171;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Pancreatic Enzyme Damage Analysis</h1>
  <div class="subtitle">
    Comparative analysis of functional vs. damaged pancreatic enzymes
  </div>

  <div class="container">

    <textarea id="referenceSeq"
      placeholder="Reference pancreatic enzyme sequence (functional)"></textarea>

    <textarea id="damagedSeq"
      placeholder="Damaged pancreatic enzyme sequence"></textarea>

    <button onclick="runAnalysis()">Preview Functional Annotation</button>

    <div id="enzymeName" class="enzyme-id"></div>
    <div id="status"></div>

    <div id="results" class="grid" style="display:none;">

      <div class="box amber">
        <span class="label">UniProt ID</span>
        <span id="uniprot"></span>
      </div>

      <div class="box red">
        <span class="label">Damage Classification</span>
        <span id="damage"></span>
      </div>

      <div class="box sky">
        <span class="label">Functional Impact</span>
        <span id="impact"></span>
      </div>

      <div class="box green">
        <span class="label">Confidence Score</span>
        <span id="confidence"></span>
      </div>

      <div class="box violet">
        <span class="label">Damaged Enzyme Region</span>
        <span id="region"></span>
      </div>

    </div>
  </div>

  <script>
    async function runAnalysis() {
      const reference = document.getElementById("referenceSeq").value.trim();
      const damaged = document.getElementById("damagedSeq").value.trim();

      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const enzymeName = document.getElementById("enzymeName");

      status.innerHTML = "";
      enzymeName.textContent = "";
      results.style.display = "none";

      if (!reference || !damaged) {
        status.innerHTML =
          "<div class='error'>Both pancreatic enzyme sequences are required.</div>";
        return;
      }

      status.innerHTML = "Analyzing pancreatic enzyme sequences...";

      try {
        const response = await fetch(
          "https://backend123-xbsm.onrender.com/analyze",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              reference_sequence: reference,
              damaged_sequence: damaged
            })
          }
        );

        const data = await response.json();
        if (!response.ok) throw new Error(data.error);

        enzymeName.textContent =
          `Identified Pancreatic Enzyme: ${data.enzyme_name}`;

        document.getElementById("uniprot").textContent = data.uniprot_id;
        document.getElementById("damage").textContent = data.damage_type;
        document.getElementById("impact").textContent = data.functional_impact;
        document.getElementById("confidence").textContent = data.confidence;
        document.getElementById("region").textContent =
          data.damaged_region_description;

        status.innerHTML = "";
        results.style.display = "grid";

      } catch (err) {
        status.innerHTML =
          `<div class="error">${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
