<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pancreatic Enzyme Functional Analyzer</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  padding: 20px;
}

h1 {
  text-align: center;
}

.container {
  max-width: 900px;
  margin: auto;
}

.box {
  background: #020617;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 20px;
}

.blue { border-left: 6px solid #3b82f6; }
.red { border-left: 6px solid #ef4444; }
.green { border-left: 6px solid #22c55e; }
.purple { border-left: 6px solid #a855f7; }

textarea {
  width: 100%;
  height: 110px;
  font-family: monospace;
  font-size: 14px;
  background: #020617;
  color: white;
  border: 1px solid #334155;
  border-radius: 6px;
}

button {
  display: block;
  margin: 20px auto;
  padding: 12px 26px;
  font-size: 16px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

#status {
  text-align: center;
  margin-bottom: 15px;
  font-weight: bold;
}

pre {
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h1>Pancreatic Enzyme Functional Annotation</h1>

<div class="container">

  <div class="box blue">
    <h3>Functioning Pancreatic Enzyme Sequence</h3>
    <textarea id="refSeq"></textarea>
  </div>

  <div class="box red">
    <h3>Damaged Pancreatic Enzyme Sequence</h3>
    <textarea id="damSeq"></textarea>
  </div>

  <button onclick="runAnalysis()">Preview Functional Annotation</button>

  <div id="status"></div>

  <div class="box green">
    <h3>Identified Pancreatic Enzyme</h3>
    <pre id="enzyme">—</pre>
  </div>

  <div class="box purple">
    <h3>Damage Analysis</h3>
    <pre id="damage">—</pre>
  </div>

</div>

<script>

const BACKEND_URL = "https://backend123-xbsm.onrender.com/analyze";

async function runAnalysis() {
  const refSeq = document.getElementById("refSeq").value.trim();
  const damSeq = document.getElementById("damSeq").value.trim();
  const status = document.getElementById("status");

  document.getElementById("enzyme").innerText = "—";
  document.getElementById("damage").innerText = "—";

  if (!refSeq || !damSeq) {
    status.innerText = "Please paste both sequences";
    return;
  }

  status.innerText = "Analyzing";

  try {
    const response = await fetch(BACKEND_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        reference_sequence: refSeq,
        damaged_sequence: damSeq
      })
    });

    if (!response.ok) {
      throw new Error("Backend error");
    }

    const data = await response.json();
