<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enzyme vs. Damaged Sequence Impact Analysis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .panel {
      background: #020617;
      padding: 16px;
      border-radius: 12px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }

    textarea {
      background: #020617;
      color: white;
      border: 1px solid #334155;
      font-family: monospace;
      height: 120px;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
      <button onclick="alert('CLICK WORKS')">
  Preview Functional Annotation
</button>

    }

    button:hover {
      background: #1d4ed8;
    }

    .results {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .box {
      background: #020617;
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 8px;
    }

    .label {
      font-weight: bold;
      color: #93c5fd;
      display: block;
      margin-bottom: 4px;
    }

    .error {
      color: #f87171;
      margin-top: 10px;
      font-weight: bold;
    }

    .success {
      color: #86efac;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <h1>Enzyme vs. Damaged Sequence Impact Analysis</h1>

  <div class="panel">

    <label class="label">Functioning (Reference) Enzyme Sequence</label>
    <textarea id="refSeq" placeholder="Paste functioning pancreatic enzyme sequence"></textarea>

    <label class="label">Damaged Enzyme Sequence</label>
    <textarea id="damSeq" placeholder="Paste damaged enzyme sequence"></textarea>

    <button onclick="runAnalysis()">Preview Functional Annotation</button>

    <div id="status"></div>

    <div class="results" id="results" style="display:none;">
      <div class="box">
        <span class="label">Identified Pancreatic Enzyme</span>
        <span id="enzyme"></span>
      </div>

      <div class="box">
        <span class="label">UniProt Accession</span>
        <span id="uniprot"></span>
      </div>

      <div class="box">
        <span class="label">Damage Classification</span>
        <span id="damage"></span>
      </div>

      <div class="box">
        <span class="label">Functional Impact</span>
        <span id="impact"></span>
      </div>

      <div class="box">
        <span class="label">Confidence</span>
        <span id="confidence"></span>
      </div>
    </div>
  </div>

  <script>
    const API_URL = https://backend123-xbsm.onrender.com/analyze";

    async function runAnalysis() {
      const reference_sequence = document.getElementById("refSeq").value.trim();
      const damaged_sequence = document.getElementById("damSeq").value.trim();
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      status.innerHTML = "";
      results.style.display = "none";

      if (!reference_sequence || !damaged_sequence) {
        status.innerHTML = "<div class='error'>Both sequences are required.</div>";
        return;
      }

      status.innerHTML = "<div class='success'>Analyzing sequence…</div>";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            reference_sequence,
            damaged_sequence
          })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || "API failure");
        }

        document.getElementById("enzyme").textContent = data.enzyme;
        document.getElementById("uniprot").textContent = data.uniprot_id;
        document.getElementById("damage").textContent = data.damage_type;
        document.getElementById("impact").textContent = data.functional_impact;
        document.getElementById("confidence").textContent = data.confidence;

        results.style.display = "grid";
        status.innerHTML = "";

      } catch (err) {
        status.innerHTML = "<div class='error'>Backend request failed.</div>";
        console.error(err);
      }
    }
  </script>
</body>
</html>
