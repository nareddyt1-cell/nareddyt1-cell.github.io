<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enzyme Sequence Analyzer</title>
<style>
body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
h1 { text-align: center; color: #333; }
.container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
label { font-weight: bold; display: block; margin-bottom: 5px; }
textarea { width: 100%; height: 120px; margin-bottom: 20px; padding: 10px; font-family: monospace; font-size: 14px; border: 1px solid #ccc; border-radius: 5px; resize: vertical; }
button { padding: 12px 25px; font-size: 16px; border: none; border-radius: 5px; background-color: #007BFF; color: white; cursor: pointer; }
button:hover { background-color: #0056b3; }
#results { margin-top: 30px; padding: 20px; background-color: #eef2f7; border-radius: 8px; white-space: pre-wrap; font-family: monospace; }
.diff { background-color: #ffcccc; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
    <h1>Enzyme Sequence Analyzer</h1>

    <label for="normal-seq">Normal Enzyme Sequence:</label>
    <textarea id="normal-seq" placeholder="Paste normal enzyme sequence here..."></textarea>

    <label for="damaged-seq">Damaged Enzyme Sequence:</label>
    <textarea id="damaged-seq" placeholder="Paste damaged enzyme sequence here..."></textarea>

    <button id="analyze-btn">Analyze Sequence</button>

    <div id="results"></div>
</div>

<script>
const analyzeBtn = document.getElementById('analyze-btn');
const resultsDiv = document.getElementById('results');

// UPDATE THIS to your Render backend URL
const BACKEND_URL = "https://your-backend.onrender.com/analyze";

function highlightDiff(normal, damaged) {
    let highlighted = '';
    for (let i = 0; i < damaged.length; i++) {
        if (normal[i] !== damaged[i]) {
            highlighted += `<span class="diff">${damaged[i]}</span>`;
        } else {
            highlighted += damaged[i];
        }
    }
    return highlighted;
}

analyzeBtn.addEventListener('click', async () => {
    const normalSeq = document.getElementById('normal-seq').value.trim();
    const damagedSeq = document.getElementById('damaged-seq').value.trim();

    if (!normalSeq || !damagedSeq) {
        alert("Please enter both sequences.");
        return;
    }

    resultsDiv.innerHTML = "Analyzing sequences...";

    try {
        const response = await fetch(https://backend123-xbsm.onrender.com, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ normalSeq, damagedSeq })
        });

        if (!response.ok) throw new Error(`Server error: ${response.status}`);

        const data = await response.json();
        const highlighted = highlightDiff(normalSeq, damagedSeq);

        resultsDiv.innerHTML = `<strong>Damaged Sequence with Differences Highlighted:</strong>\n${highlighted}\n\n<strong>Backend Analysis:</strong>\n${data.result}`;
    } catch (err) {
        console.error(err);
        resultsDiv.textContent = "Error analyzing sequences. Check console for details.";
    }
});
</script>
</body>
</html>
