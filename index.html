<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enzyme vs. Damaged Sequence Impact Analysis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 26px;
      font-weight: bold;
    }

    .panel {
      background: #020617;
      padding: 20px;
      border-radius: 12px;
      max-width: 800px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    label {
      font-weight: bold;
      margin-top: 12px;
      display: block;
      color: #93c5fd;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #020617;
      color: #e5e7eb;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .status {
      margin-top: 14px;
      font-style: italic;
      color: #cbd5f5;
    }

    .error {
      color: #f87171;
      margin-top: 12px;
    }

    .results {
      margin-top: 24px;
      display: none;
    }

    .box {
      background: #020617;
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .box-title {
      font-weight: bold;
      color: #93c5fd;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>
  <h1>Enzyme vs. Damaged Sequence Impact Analysis</h1>

  <div class="panel">

    <label for="referenceSeq">Reference (Functioning) Sequence</label>
    <textarea id="referenceSeq" placeholder="Paste reference enzyme sequence"></textarea>

    <label for="damagedSeq">Damaged Sequence</label>
    <textarea id="damagedSeq" placeholder="Paste damaged sequence"></textarea>

    <button onclick="runAnalysis()">Preview Functional Annotation</button>

    <div class="status" id="status"></div>

    <div class="results" id="results">
      <div class="box">
        <div class="box-title">UniProt ID</div>
        <div id="uniprot"></div>
      </div>

      <div class="box">
        <div class="box-title">Damage Classification</div>
        <div id="damage"></div>
      </div>

      <div class="box">
        <div class="box-title">Functional Impact</div>
        <div id="impact"></div>
      </div>

      <div class="box">
        <div class="box-title">Confidence Score</div>
        <div id="confidence"></div>
      </div>
    </div>

  </div>

  <script>
    async function runAnalysis() {
      const reference = document.getElementById("referenceSeq").value.trim();
      const damaged = document.getElementById("damagedSeq").value.trim();
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      if (!reference || !damaged) {
        status.innerHTML = "<span class='error'>Please provide both sequences.</span>";
        return;
      }

      status.textContent = "Analyzing sequences...";
      results.style.display = "none";

      try {
        const response = await fetch("https://backend123-xbsm.onrender.com", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            reference_sequence: reference,
            damaged_sequence: damaged
          })
        });

        if (!response.ok) throw new Error("API request failed");

        const data = await response.json();

        document.getElementById("uniprot").textContent = data.uniprot_id;
        document.getElementById("damage").textContent = data.damage_type;
        document.getElementById("impact").textContent = data.functional_impact;
        document.getElementById("confidence").textContent = data.confidence;

        status.textContent = "";
        results.style.display = "block";

      } catch (err) {
        console.error(err);
        status.innerHTML = "<span class='error'>Backend request failed.</span>";
      }
    }
  </script>
</body>
</html>
